<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:50;background:rgba(245,242,236,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(21,19,15,.08);font-family:'Hanken Grotesk',system-ui,sans-serif;color:#15130F">
  <div style="max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,40px);height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Webaware%20Home.dc.html" style="display:flex;align-items:center;flex:none"><img src="https://webaware.nl/wp-content/uploads/2024/11/Untitled-2.png" alt="Webaware Websites &amp; Online Marketing" style="height:40px;width:auto;display:block"></a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:36px">
        <nav style="display:flex;align-items:center;gap:28px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
            <a href="{{ it.href }}" style="position:relative;font-size:15.5px;font-weight:{{ it.weight }};text-decoration:none;color:#15130F;padding:6px 0;border-bottom:2px solid {{ it.line }}" style-hover="color:#B4570A">{{ it.label }}</a>
          </sc-for>
        </nav>
        <div style="display:flex;align-items:center;gap:18px">
          <a href="tel:0637418075" style="font-size:15.5px;font-weight:600;text-decoration:none;color:#15130F;white-space:nowrap" style-hover="color:#B4570A">06-37418075</a>
          <a href="Contact.dc.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:#F7931E;color:#15130F;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .2s" style-hover="background:#FFA640;color:#15130F">Vrijblijvende offerte</a>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="width:48px;height:48px;border-radius:50%;border:1.5px solid #15130F;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0">
        <span style="width:18px;height:2px;background:#15130F;border-radius:2px"></span>
        <span style="width:18px;height:2px;background:#15130F;border-radius:2px"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(21,19,15,.08);padding:16px clamp(20px,4vw,40px) 28px;display:flex;flex-direction:column;gap:4px;background:#F5F2EC">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
        <a href="{{ it.href }}" style="font-family:'Funnel Display',sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.02em;text-decoration:none;color:#15130F;padding:8px 0">{{ it.label }}</a>
      </sc-for>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px">
        <a href="Contact.dc.html" style="display:inline-flex;align-items:center;padding:15px 22px;border-radius:999px;background:#F7931E;color:#15130F;font-weight:600;font-size:16px;text-decoration:none">Vrijblijvende offerte</a>
        <a href="tel:0637418075" style="display:inline-flex;align-items:center;padding:13.5px 20.5px;border-radius:999px;border:1.5px solid #15130F;color:#15130F;font-weight:600;font-size:16px;text-decoration:none">06-37418075</a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Portfolio&quot;,&quot;Over&quot;,&quot;Reviews&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const a = this.props.active ?? '';
    const nav = [['Home','Webaware%20Home.dc.html'],['Portfolio','Portfolio.dc.html'],['Over','Over.dc.html'],['Reviews','Reviews.dc.html'],['Contact','Contact.dc.html']];
    const narrow = this.state.w < 960;
    return {
      items: nav.map(([label, href]) => ({ label, href, weight: label === a ? 700 : 500, line: label === a ? '#F7931E' : 'transparent' })),
      wide: !narrow, narrow, menuVisible: narrow && this.state.menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu }))
    };
  }
}
</script>
</body>
</html>
